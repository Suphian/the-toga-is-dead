<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="Projects by Suphi. One month. Something new."><title>Suph.app — Projects by Suphi</title><link rel="canonical" href="https://suph.app/"><link rel="stylesheet" href="/projects/home.css"><script>if(new URLSearchParams(location.search).has("room")||new URLSearchParams(location.search).has("theme")){location.replace("/Toga"+location.search+location.hash)}</script></head><body>
<div id="suph-home-concept" aria-label="Suph.app">
  <header class="suph-header">
    <a class="suph-wordmark" href="/" aria-label="Suph.app home">suph.app<span aria-hidden="true">.</span></a>
  </header>
  <main id="suph-main">
    <h1 class="suph-visually-hidden">Projects</h1>
    <div class="suph-project-grid">
      <a class="suph-project" href="/Toga" aria-label="Play The Toga Is Dead">
        <div class="suph-art"><canvas id="suph-toga-canvas" role="img" aria-label="Video of a Roman stone head, rendered in black and white"></canvas><span class="suph-video-status" data-video-status="toga">Loading video</span></div>
        <div class="suph-caption"><h2>The Toga Is Dead</h2><span aria-hidden="true">↗</span></div>
      </a>
      <a class="suph-project" href="/quran" aria-label="Open Quran Art">
        <div class="suph-art"><canvas id="suph-quran-canvas" role="img" aria-label="Video of Quran pages turning, rendered in black and white"></canvas><span class="suph-video-status" data-video-status="quran">Loading video</span></div>
        <div class="suph-caption"><h2>Quran Art</h2><span aria-hidden="true">↗</span></div>
      </a>
      <article class="suph-project suph-future" aria-label="Coming soon">
        <div class="suph-art"><canvas id="suph-future-canvas" role="img" aria-label="Black ink blooming in water, rendered in dither"></canvas><span class="suph-video-status" data-video-status="coming">Loading video</span></div>
        <div class="suph-caption"><h2>Coming soon</h2></div>
      </article>
    </div>
  </main>
</div>


<script src="/projects/video-card.js"></script><script src="/projects/home.js"></script></body></html>
